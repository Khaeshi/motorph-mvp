spring.application.name=motorph-mvp

# --- Database (edit to match your local MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/motorph_security?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-run schema.sql / data.sql on every startup (fine for this MVP;
# turn off once you don't want the seed data reset each run).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none

# --- R-06: session hardening ---
# 15-minute idle timeout, matching the IAS 1 control.
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# NOTE: 'secure=true' means the cookie is only sent over HTTPS.
# For local testing over plain http://localhost, either:
#   (a) set this to false temporarily, or
#   (b) run the app behind local TLS (see README) to test the real setting.
server.servlet.session.cookie.secure=true

# Show SQL in console while you're getting things working (optional).
logging.level.org.springframework.jdbc.core=INFO
